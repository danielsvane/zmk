description: Sticky key behavior

compatible: "zmk,behavior-sticky-key"

include: one_param.yaml

properties:
  bindings:
    type: phandles
    required: true
  release-after-ms:
    type: int
    required: true
  quick-release:
    type: boolean
  lazy:
    type: boolean
  ignore-modifiers:
    type: boolean
  runtime-editable:
    type: boolean
    description: |
      Marks this instance as part of the runtime-editable spare pool
      (CONFIG_ZMK_BEHAVIOR_RUNTIME_EDITING). Its config is placed in RAM and
      registered as a Studio custom-behaviour slot. Not for hand-written keymaps.
